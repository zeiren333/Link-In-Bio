<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="overlay-canvas"></canvas>
    <div id="overlay-text">Click to continue</div>
    <audio id="bg-music" src="song.mp3" preload="auto" crossorigin="anonymous" loop></audio>
    <div class="container">
        <div class="profile-card">
            <div class="banner"></div>
            <div class="card-badges-container">
                <div class="card-badge badge-views" id="badge-views">
                    <i class="fa-solid fa-eye"></i>
                    <span id="view-count-text">...</span>
                    <span class="badge-tooltip">Просмотры</span>
                </div>
                <div class="card-badge badge-verified">
                    <i class="fa-solid fa-circle-check"></i>
                    <span class="badge-tooltip">Подтвержденный профиль</span>
                </div>
                <div class="card-badge badge-vip">
                    <i class="fa-solid fa-crown"></i>
                    <span class="badge-tooltip">VIP Разработчик</span>
                </div>
            </div>
            <div class="avatar-container">
                <div class="avatar" id="discord-avatar"></div>
                <div class="spotify-indicator" id="spotify-indicator"><i class="fa-brands fa-spotify"></i></div>
                <div class="spotify-tooltip" id="spotify-tooltip">
                    <span class="spotify-title" id="spotify-track">Spotify</span>
                    <span class="spotify-artist" id="spotify-artist">Загрузка...</span>
                </div>
            </div>
            <div class="profile-info">
                <h2 class="username" id="discord-name">Загрузка...</h2>
                <p class="bio">
                    Лучшие визуалы в тгшке <a href="https://rivalvisuals.t.me" target="_blank" class="bio-link">rivalvisuals.t.me</a>
                </p>
            </div>
            <div class="social-links">
                <a href="https://t.me/doxernet" class="social-icon" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://discord.com/users/1474075672526852158" class="social-icon" target="_blank"><i class="fa-brands fa-discord"></i></a>
                <a href="https://funpay.com" class="social-icon" target="_blank"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        increment,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAAMavidJBXQ3TU20i3Xmg1kjZkSVv_67U",
        authDomain: "link-in-bio-app-5787b.firebaseapp.com",
        projectId: "link-in-bio-app-5787b",
        storageBucket: "link-in-bio-app-5787b.firebasestorage.app",
        messagingSenderId: "1077685830887",
        appId: "1:1077685830887:web:9d9f11193edcee784ace42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    await signInAnonymously(auth);

    const statsRef = doc(
        db,
        "artifacts",
        "profile-card",
        "public",
        "data",
        "analytics",
        "cardViews"
    );

    const countEl = document.getElementById("view-count-text");

    onSnapshot(statsRef, snap => {
        if (snap.exists()) {
            countEl.textContent = snap.data().count.toLocaleString();
        } else {
            countEl.textContent = "0";
        }
    });

    if (!sessionStorage.getItem("visited_profile_card")) {
        sessionStorage.setItem("visited_profile_card", "true");

        const snap = await getDoc(statsRef);

        if (snap.exists()) {
            await updateDoc(statsRef, {
                count: increment(1)
            });
        } else {
            await setDoc(statsRef, {
                count: 1
            });
        }
    }
    </script>
</body>
</html>
